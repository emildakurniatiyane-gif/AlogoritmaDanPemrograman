<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Peringkat Kelas</title>
    <style>
      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #eef6ff, #dfe9ff, #fdf2f8);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 24px;
      }

      .container {
        width: 100%;
        max-width: 760px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        border-radius: 20px;
        box-shadow: 0 18px 40px rgba(37, 99, 235, 0.12);
        padding: 30px;
      }

      .header {
        text-align: center;
        margin-bottom: 20px;
      }

      .header h2 {
        margin: 0;
        font-size: 2rem;
        color: #1e3a8a;
      }

      .header p {
        margin: 10px 0 0;
        color: #475569;
      }

      .input-card {
        background: linear-gradient(135deg, #f8fbff, #eef4ff);
        border: 1px solid #dbeafe;
        border-radius: 16px;
        padding: 18px;
      }

      input {
        width: 100%;
        padding: 14px 16px;
        border: 1px solid #bfdbfe;
        border-radius: 12px;
        font-size: 16px;
        margin-bottom: 12px;
        outline: none;
      }

      input:focus {
        border-color: #60a5fa;
        box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.2);
      }

      button {
        width: 100%;
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, #2563eb, #3b82f6);
        color: white;
        padding: 14px 16px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s ease;
      }

      button:hover {
        transform: translateY(-1px);
        box-shadow: 0 10px 18px rgba(37, 99, 235, 0.2);
      }

      .hasil {
        margin-top: 25px;
        background: linear-gradient(135deg, #ffffff, #f8fbff);
        border: 1px solid #dbeafe;
        border-radius: 18px;
        padding: 20px;
      }

      .hasil p {
        margin: 10px 0;
        font-size: 16px;
      }

      .judul-hasil {
        font-weight: bold;
        color: #1e3a8a;
        margin-bottom: 8px;
      }

      .angka-terbesar {
        font-size: 20px;
        color: #0f172a;
        font-weight: bold;
        margin: 12px 0 18px;
      }

      .ranking {
        margin: 12px 0 0 20px;
        padding: 0;
      }

      .ranking li {
        margin: 10px 0;
        padding: 8px 12px;
        border-radius: 10px;
        background: #f8fafc;
      }

      .ranking li:nth-child(1) {
        background: #fef3c7;
        border: 1px solid #fcd34d;
      }

      .ranking li:nth-child(2) {
        background: #e2e8f0;
      }

      .ranking li:nth-child(3) {
        background: #fde68a;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h2>Peringkat Kelas</h2>
        <p>Urutkan nilai siswa dari terbesar sampai terkecil</p>
      </div>

      <div class="input-card">
        <input type="text" id="inputNilai" value="85, 90, 78, 95, 88, 80, 97" />
        <button onclick="cariJuara()">Urutkan Nilai</button>
      </div>

      <div class="hasil" id="hasilPeringkat"></div>
    </div>

    <script>
      function cariJuara() {
        const teks = document.getElementById('inputNilai').value;
        const arr = teks
          .split(',')
          .map((nilai) => Number(nilai.trim()))
          .filter((nilai) => !isNaN(nilai));

        if (arr.length === 0) {
          document.getElementById('hasilPeringkat').innerHTML = '<p>Masukkan nilai terlebih dahulu.</p>';
          return;
        }

        const ranking = [...arr].sort((a, b) => b - a);
        const angkaTerbesar = ranking[0];

        const html = `
          <p class="judul-hasil">Tampilkan hasil</p>
          <p class="angka-terbesar">Angka terbesar: ${angkaTerbesar}</p>
          <p><strong>Array nilai:</strong> [${arr.join(', ')}]</p>
          <p><strong>Ranking kelas:</strong></p>
          <ol class="ranking">
            ${ranking
              .map((nilai, index) => `<li>${index + 1}. ${nilai}</li>`)
              .join('')}
          </ol>
        `;

        document.getElementById('hasilPeringkat').innerHTML = html;
      }

      cariJuara();
    </script>
  </body>
</html>
